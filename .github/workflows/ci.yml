name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: placeholder
      SUPABASE_SECRET_API: placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAACFYZvRbKjlgehcx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests (with coverage thresholds)
        run: pnpm test:coverage

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
